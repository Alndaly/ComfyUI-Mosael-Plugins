[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-mosael-plugins"
version = "1.5.1"
description = "ComfyUI custom nodes: optional inputs and lazy switches that auto-switch a single workflow between txt2img and img2img"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "ComfyUI-Mosael-Plugins contributors" }]
requires-python = ">=3.9"
keywords = ["comfyui", "custom-nodes", "optional-inputs", "lazy-evaluation"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
]

[project.optional-dependencies]
# Speech-to-text / VAD nodes (FunASR Transcribe, VAD Auto Trim Audio,
# Audio Trim by Segments). Works on Windows, Linux and macOS.
funasr = ["funasr"]

[project.urls]
Homepage = "https://github.com/Alndaly/ComfyUI-Mosael-Plugins"

[tool.setuptools]
packages = ["nodes", "utils"]
include-package-data = true

# Tests are run with `pytest tests` (see tests/pytest.ini).  Keep pytest
# configuration out of this file: making the repo root a pytest rootdir makes
# pytest treat the plugin package's __init__.py as an importable test package,
# which fails because ComfyUI loads it outside any package context.
